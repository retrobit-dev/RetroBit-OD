name: build

on:
  workflow_dispatch:
  push:
    branches: [ "arena/1d4014a0-retrobit-od", "main" ]
  pull_request:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pastikan komponen SDK ada
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}  ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "sdkmanager tidak ditemukan; mengandalkan auto-download AGP"
            exit 0
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          ls "$SDK/platforms"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: bash scripts/gradle-task.sh assembleDebug

      - name: Assemble release APK
        run: bash scripts/gradle-task.sh assembleRelease

      - name: Kumpulkan APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/RetroBit-OD-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/RetroBit-OD-release.apk
          ls -la out
          for f in out/*.apk; do echo "$f -> $(du -h "$f" | cut -f1)"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrobit-od-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK ke GitHub Release (tag: apk-latest)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=apk-latest
          notes="Build otomatis dari \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA:0:7}\`.\n\n- \`RetroBit-OD-debug.apk\` — untuk dicoba (bisa di-install berdampingan, applicationId berakhiran .debug)\n- \`RetroBit-OD-release.apk\` — ditandatangani debug keystore, siap dipasang permanen\n\nSetelah pasang: buka app → izinkan overlay & abaikan optimasi baterai (XOS). Lihat README untuk checklist."
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release create "$tag" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "RetroBit OD APK" \
            --notes "$(printf '%b' "$notes")" \
            --prerelease \
            --target "$GITHUB_SHA"
          echo "APK: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"

      - name: Lampirkan log error ke issue (biar bisa dibaca dari sandbox)
        if: failure()
        run: |
          body=$(mktemp)
          {
            echo "Log build gagal pada commit ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            for f in /tmp/gradle-*.log; do
              [ -f "$f" ] || continue
              echo "### $f"
              echo '```'
              tail -c 45000 "$f"
              echo '```'
            done
          } > "$body"
          # potong biar tidak melewati batas body issue
          head -c 65000 "$body" > "$body.trim"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "build gagal @ ${GITHUB_SHA:0:7}" \
            --body-file "$body.trim"
