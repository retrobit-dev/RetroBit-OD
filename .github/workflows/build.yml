name: build

on:
  workflow_dispatch:
  push:
    branches: [ "arena/1d4014a0-retrobit-od", "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pastikan komponen SDK ada
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}  ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "sdkmanager tidak ditemukan; mengandalkan auto-download AGP"
            exit 0
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          ls "$SDK/platforms"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Assemble release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Kumpulkan APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/RetroBit-OD-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/RetroBit-OD-release.apk
          ls -la out
          for f in out/*.apk; do echo "::group::$f"; du -h "$f"; unzip -l "$f" | tail -5; echo "::endgroup::"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrobit-od-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
